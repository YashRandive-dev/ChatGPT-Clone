# Render Blueprint for the Kairo API (https://render.com/docs/blueprint-spec)
# Free plan. Note: free instances sleep when idle, and uploaded files are lost on redeploy
# (free plans have no persistent disk).
services:
  - type: web
    name: kairo-api
    runtime: node
    rootDir: backend
    plan: free
    # `npm start` also compiles automatically if dist/ is missing, so a plain
    # `npm install` build command works too.
    buildCommand: npm install --omit=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Proxy hops in front of the API: 2 when Vercel forwards /api to Render (recommended setup),
      # 1 when the browser calls Render directly.
      - key: TRUST_PROXY
        value: "2"
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: AI_MODELS
        sync: false
      - key: AI_DEFAULT_MODEL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false

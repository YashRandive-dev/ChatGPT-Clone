# Render Blueprint for the Kairo API (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: kairo-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: kairo-uploads
      mountPath: /var/data
      sizeGB: 1
